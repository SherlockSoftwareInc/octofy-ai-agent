name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Only run if the comment starts with /oc or /opencode
    if: |
      contains(github.event.comment.body, '/oc') || 
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # Replace with your preferred provider key
          OPENAI_API_KEY: ${{ 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 }}
        with:
          model: openai/gpt-5.1-codex