name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Only run if the comment starts with /oc or /opencode
    if: |
      contains(github.event.comment.body, '/oc') || 
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # Replace with your preferred provider key
          LLM_API_KEY: ${{ sk-...... }}
        with:
          model: openai/gpt-5.1-codex
