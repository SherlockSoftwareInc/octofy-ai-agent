version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCDCTL_API=3
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - sqlagent-net
    restart: unless-stopped

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    networks:
      - sqlagent-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: sql-agent-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - MILVUS_HOST=milvus
    depends_on:
      - milvus
    networks:
      - sqlagent-net
    restart: unless-stopped

    volumes:
      - ./config/agent_settings.json:/app/config/agent_settings.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sql-agent-frontend
    ports:
      - "3500:80"
    depends_on:
      - backend
    networks:
      - sqlagent-net
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v2.3.13
    container_name: milvus
    command: [ "milvus", "run", "standalone" ]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
    networks:
      - sqlagent-net
    depends_on:
      - etcd
      - minio
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus

networks:
  sqlagent-net: # bridge is default, no 'driver' key needed for Compose v3
