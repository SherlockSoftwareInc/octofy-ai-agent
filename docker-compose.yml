version: '3.5'

services:
  etcd:
    container_name: octofyagent-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCDCTL_API=3
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://octofyagent-etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - octofyagent-net
    restart: unless-stopped

  minio:
    container_name: octofyagent-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: server /minio_data --console-address ":9101"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    networks:
      - octofyagent-net
    restart: unless-stopped

  postgres:
    container_name: octofyagent-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: octofy
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: octofy_users
    ports:
      - "5432:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    networks:
      - octofyagent-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octofy"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.3.13
    container_name: octofyagent-milvus
    command: [ "milvus", "run", "standalone" ]
    ports:
      - "19630:19530"
      - "9191:9091"
    environment:
      - ETCD_ENDPOINTS=octofyagent-etcd:2379
      - MINIO_ADDRESS=octofyagent-minio:9000
    networks:
      - octofyagent-net
    depends_on:
      - etcd
      - minio
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus

networks:
  octofyagent-net: # bridge is default, no 'driver' key needed for Compose v3
